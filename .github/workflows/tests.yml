name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # astrbot on PyPI requires >= 3.12, so 3.10/3.11 cannot be covered here.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Pin astrbot >= 4.28.2: without a floor, pip can silently backtrack to an
        # ancient astrbot (e.g. 4.11.4) on some Python versions, whose missing
        # astrbot.api.web module breaks the test suite at import time.
        run: pip install "astrbot>=4.28.2" pytest

      - name: Run tests
        run: python -m pytest tests/ -v
